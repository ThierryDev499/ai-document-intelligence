<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>AI Document Intelligence</title>
    <link rel="icon" href="/static/file-text.svg" />
    <link rel="stylesheet" href="/static/style.css" />
    <script src="/static/app.js?v=1" defer></script>
  </head>
  <body>
    <header>
      <div class="brand">
        <img
          src="/static/file-text.svg"
          alt=""
          width="24"
          height="24"
        />Document Intelligence
      </div>
      <span class="badge">LOCAL WORKSPACE</span><a href="/docs">API docs</a>
    </header>
    <main>
      <div class="page-heading">
        <div>
          <p class="eyebrow">KNOWLEDGE OPERATIONS</p>
          <h1>Document workspace</h1>
        </div>
        <button id="sample">Load sample PDF</button>
      </div>
      <p id="notice" role="status" aria-live="polite"></p>
      <div class="workspace">
        <aside>
          <div class="section-head">
            <h2>Library</h2>
            <span id="count">0</span>
          </div>
          <form id="upload">
            <label for="file">PDF document</label
            ><input
              id="file"
              name="file"
              type="file"
              accept=".pdf,application/pdf"
              required
            /><button class="primary" type="submit">Import document</button>
          </form>
          <div id="library"></div>
        </aside>
        <section class="document">
          <div class="section-head">
            <h2 id="docName">Select a document</h2>
            <button
              id="delete"
              title="Delete document"
              aria-label="Delete document"
              hidden
            >
              <img src="/static/trash-2.svg" alt="" width="18" height="18" />
            </button>
          </div>
          <p id="meta" class="muted">No document selected</p>
          <div class="tabs" role="group" aria-label="Document view">
            <button data-view="summary" aria-pressed="true">Overview</button
            ><button data-view="text" aria-pressed="false">
              Extracted text</button
            ><button data-view="history" aria-pressed="false">History</button>
          </div>
          <div id="content">
            <p class="empty">Your document library is empty.</p>
          </div>
        </section>
        <section class="assistant">
          <div class="section-head">
            <h2>Ask the document</h2>
            <span class="badge">RAG</span>
          </div>
          <div id="answer"><p class="empty">No questions yet.</p></div>
          <form id="question">
            <label for="prompt">Question</label
            ><textarea
              id="prompt"
              minlength="3"
              maxlength="1500"
              rows="3"
              placeholder="What is the support response time?"
              required
            ></textarea
            ><button class="primary" type="submit" disabled>
              Ask question
              <img
                src="/static/arrow-up-right.svg"
                alt=""
                width="16"
                height="16"
              />
            </button>
          </form>
        </section>
      </div>
      <footer>
        <span id="model">Ollama</span
        ><span>Private by default · SQLite storage</span>
      </footer>
    </main>
  </body>
</html>
